[project]
name = "agente"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas", "openpyxl", "pydantic", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
